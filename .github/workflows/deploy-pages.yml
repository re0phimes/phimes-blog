name: Deploy to Cloudflare Pages

# 从 Vercel 迁到 Cloudflare Pages 后，部署由这里完成。
#
# 需要先在仓库设置两个 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   一个只带「Cloudflare Pages:Edit」权限的 API Token
#   CLOUDFLARE_ACCOUNT_ID  2cb7ae35f9305d1bfc18cf40172f6bdb
#
# 还没配置这两个 Secret 时会跳过部署并留一条 warning（不会红叉）。

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
        env:
          # 浏览量接口实测要 20~45 秒，默认 8 秒会超时并把缓存写空
          POPULAR_FETCH_TIMEOUT_MS: "45000"

      # 注意：secrets 上下文不能用在 step 级的 if 里 —— GitHub 会在校验阶段直接
      # 拒绝整个 workflow，表现为 0 秒失败且没有任何 job 日志。
      # 所以这里先把 secret 读进 env，再用 step output 控制后续是否执行。
      - name: 检查部署凭证
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::还没配置 CLOUDFLARE_API_TOKEN，本次跳过部署。到 Settings → Secrets and variables → Actions 添加 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID。"
          fi

      - name: 部署到 Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vitepress/dist --project-name=phimes-blog --branch=master
